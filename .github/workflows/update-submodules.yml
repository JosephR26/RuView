name: Update vendor submodules

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  pull-requests: write

# Serialize runs against the shared `chore/update-submodules` branch: without
# this, two overlapping runs (a schedule firing mid-manual-dispatch) can both
# force-push over each other and race to create the PR.
concurrency:
  group: update-submodules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Identity must be set BEFORE any operation that can create a commit.
      # `git submodule update --remote --merge` used to fail here with
      # "Committer identity unknown" because the merge inside vendor/ruvector
      # needs an author when the pinned commit isn't a fast-forward of upstream.
      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Use a plain `--remote` checkout (detached HEAD at each submodule's
      # configured `branch` tip from .gitmodules) rather than `--merge`. We only
      # want to bump the superproject's gitlink to the latest upstream commit;
      # there's no reason to create merge commits inside the vendored repos, and
      # `--merge` breaks whenever the current pin has diverged from that branch.
      - name: Update submodules to latest tracked branch
        run: |
          git submodule sync --recursive
          git submodule update --remote --recursive

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "--- submodule pointer changes ---"
            git submodule status --recursive || true
            git diff --submodule=log -- vendor/ || true
          fi

      # Reuse one stable branch (force-pushed each run) instead of a fresh
      # timestamped branch per run. Every prior run that had changes left an
      # orphaned `chore/update-submodules-<timestamp>` branch behind, because
      # `gh pr create` fails whenever "Allow GitHub Actions to create and
      # approve pull requests" is disabled for this repo (Settings > Actions >
      # General > Workflow permissions) -- that policy can't be worked around
      # from workflow YAML, so a fresh branch was created and pushed on every
      # failed attempt with no PR to show for it.
      - name: Create PR with updates
        if: steps.check.outputs.changed == 'true'
        run: |
          BRANCH="chore/update-submodules"
          git checkout -B "$BRANCH"
          git add vendor/
          git commit -m "chore: update vendor submodules to latest upstream"
          git push --force origin "$BRANCH"

          if ! open_pr_count="$(gh pr list \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq 'length' 2>&1)"; then
            echo "::error::Unable to check for an open PR for $BRANCH: $open_pr_count"
            exit 1
          fi

          if [ "$open_pr_count" -gt 0 ]; then
            echo "PR already open for $BRANCH; branch updated in place."
            exit 0
          fi

          if ! pr_error="$(gh pr create \
            --title "chore: update vendor submodules" \
            --body "Automated submodule update to the latest upstream commit on each submodule's tracked branch (see \`.gitmodules\`). Review the pointer diff before merging." \
            --base main \
            --head "$BRANCH" 2>&1)"; then
            echo "$pr_error"
            if echo "$pr_error" | grep -qi "not permitted to create or approve pull requests"; then
              echo "::error::Submodules were bumped and pushed to '$BRANCH', but no pull request could be opened. This repo's Actions policy blocks GITHUB_TOKEN from creating PRs. Either enable 'Allow GitHub Actions to create and approve pull requests' under Settings > Actions > General > Workflow permissions, or add a PAT with pull-request scope as the SUBMODULE_UPDATE_PAT repo secret."
            else
              echo "::error::Submodules were bumped and pushed to '$BRANCH', but 'gh pr create' failed: $pr_error"
            fi
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_UPDATE_PAT || secrets.GITHUB_TOKEN }}
